AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudOps Sentinel - AWS Production Architecture Template.
  Provisions a secure VPC (2 AZs), Amazon RDS PostgreSQL 16, S3 Backup Bucket,
  IAM Least-Privilege Roles, CloudWatch Alarms, and Gateway VPC Endpoint for S3.
  Engineered for Associate Cloud Operations / SRE production standards.

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]
    Description: Deployment environment tier.

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t3.micro     # Free Tier Eligible (Intel/AMD)
      - db.t4g.micro    # Free Tier Eligible (AWS Graviton2)
      - db.t4g.small
      - db.m6g.large    # Production Enterprise Multi-AZ
    Description: RDS PostgreSQL compute instance sizing.

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
    Description: Allocated database storage in GB (20 GB is AWS Free Tier limit).

  DBMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable Multi-AZ failover replica for high availability (incurs cost outside free tier).

  DBMasterUsername:
    Type: String
    Default: sentinel_admin
    Description: Master administrative username for RDS PostgreSQL.

  DBMasterPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9!^&*-_+=]+"
    Description: Master password for RDS PostgreSQL (enforce strong password).

  EC2InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t3.micro      # Free Tier Eligible
      - t4g.micro     # Free Tier Eligible (Graviton)
      - t4g.small     # Recommended for full 6-container Docker stack
      - t4g.medium
    Description: EC2 compute instance type for Sentinel platform containers.

  AllowedIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Ingress CIDR allowed to access web dashboard (restrict to corporate VPN / admin IP).

Resources:
  # ============================================================================
  # 1. NETWORKING (VPC, Subnets, Routing, VPC Endpoint)
  # ============================================================================
  SentinelVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-vpc-${Environment}
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-igw-${Environment}

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SentinelVPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets (App / Load Balancer)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SentinelVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-public-az1-${Environment}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SentinelVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-public-az2-${Environment}

  # Isolated Database Subnets (RDS - Strictly No Public Routing)
  DBSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SentinelVPC
      CidrBlock: 10.0.100.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-db-az1-${Environment}

  DBSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SentinelVPC
      CidrBlock: 10.0.200.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-db-az2-${Environment}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SentinelVPC
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-public-rt-${Environment}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  DBRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SentinelVPC
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-db-rt-${Environment}

  DBSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnet1
      RouteTableId: !Ref DBRouteTable

  DBSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DBSubnet2
      RouteTableId: !Ref DBRouteTable

  # Free Gateway VPC Endpoint for S3 (Zero data transfer fees, high throughput)
  S3GatewayVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SentinelVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref DBRouteTable

  # ============================================================================
  # 2. SECURITY GROUPS (Strict Ingress/Egress Isolation)
  # ============================================================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudOps Sentinel EC2 application host
      VpcId: !Ref SentinelVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
          Description: Ingress HTTP Web Console
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
          Description: Ingress HTTPS Web Console
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: !Ref AllowedIngressCidr
          Description: Ingress FastAPI Backend
        - IpProtocol: tcp
          FromPort: 3001
          ToPort: 3001
          CidrIp: !Ref AllowedIngressCidr
          Description: Ingress Grafana Dashboards
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Outbound traffic for AWS APIs, package repositories & S3
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-ec2-sg-${Environment}

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS PostgreSQL metadata database
      VpcId: !Ref SentinelVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: Allow PostgreSQL strictly from Sentinel EC2 instances
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-rds-sg-${Environment}

  # ============================================================================
  # 3. IAM ROLES & INSTANCE PROFILE (Zero Hardcoded Credentials)
  # ============================================================================
  EC2IAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudops-sentinel-ec2-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: CloudOpsSentinelAppPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3BackupOperations
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:AbortMultipartUpload
                  - s3:PutObjectTagging
                Resource:
                  - !Sub arn:aws:s3:::${S3BackupBucket}
                  - !Sub arn:aws:s3:::${S3BackupBucket}/*
              - Sid: SecretsRetrieval
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:cloudops-sentinel/*
              - Sid: ParameterStoreRetrieval
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudops-sentinel/*
              - Sid: PutCustomTelemetry
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace:
                      - CloudOpsSentinel/Databases
                      - CloudOpsSentinel/Host
                      - CWAgent

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub cloudops-sentinel-profile-${Environment}
      Roles:
        - !Ref EC2IAMRole

  # ============================================================================
  # 4. S3 BACKUP STORAGE (AES256 Encrypted, Lifecycle Rules)
  # ============================================================================
  S3BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub cloudops-sentinel-backups-${AWS::AccountId}-${AWS::Region}
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToStandardIAAndExpire
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
            ExpirationInDays: 365
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-backups-${Environment}

  # ============================================================================
  # 5. RDS POSTGRESQL 16 DATABASE
  # ============================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub cloudops-sentinel-dbsubnets-${Environment}
      DBSubnetGroupDescription: Subnets for CloudOps Sentinel RDS cluster
      SubnetIds:
        - !Ref DBSubnet1
        - !Ref DBSubnet2

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: PostgreSQL 16 parameters for CloudOps Sentinel telemetry
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"
        shared_preload_libraries: "pg_stat_statements"
        track_activity_query_size: "2048"
        "pg_stat_statements.track": "ALL"
        "pg_stat_statements.max": "10000"

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub cloudops-sentinel-db-${Environment}
      Engine: postgres
      EngineVersion: "16.3"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      MultiAZ: !Ref DBMultiAZ
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
        - !GetAtt RDSSecurityGroup.GroupId
      DBParameterGroupName: !Ref DBParameterGroup
      DBName: sentinel_db
      MasterUsername: !Ref DBMasterUsername
      MasterUserPassword: !Ref DBMasterPassword
      BackupRetentionPeriod: 7
      PreferredBackupWindow: "03:00-04:00"
      PreferredMaintenanceWindow: "Sun:04:30-Sun:05:30"
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: !Sub cloudops-sentinel-rds-${Environment}

  # ============================================================================
  # 6. CLOUDWATCH LOG GROUP & ALARMS
  # ============================================================================
  CloudWatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ec2/cloudops-sentinel
      RetentionInDays: 30

  RDSAlarmHighCPU:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudOpsSentinel-RDS-HighCPU-${Environment}
      AlarmDescription: Alarm when RDS CPU utilization exceeds 80% for 5 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RDSInstance

  RDSAlarmLowStorage:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudOpsSentinel-RDS-LowStorage-${Environment}
      AlarmDescription: Alarm when RDS free storage falls below 5 GB
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5368709120  # 5 GB in bytes
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RDSInstance

  RDSAlarmHighConnections:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub CloudOpsSentinel-RDS-HighConnections-${Environment}
      AlarmDescription: Alarm when active DB connections exceed 80
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RDSInstance

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref SentinelVPC
  PublicSubnet1:
    Description: Public Subnet AZ1
    Value: !Ref PublicSubnet1
  PublicSubnet2:
    Description: Public Subnet AZ2
    Value: !Ref PublicSubnet2
  EC2SecurityGroupId:
    Description: Security Group ID for EC2 Host
    Value: !GetAtt EC2SecurityGroup.GroupId
  RDSEndpoint:
    Description: RDS PostgreSQL endpoint address
    Value: !GetAtt RDSInstance.Endpoint.Address
  RDSPort:
    Description: RDS PostgreSQL port
    Value: !GetAtt RDSInstance.Endpoint.Port
  S3BackupBucketName:
    Description: S3 Bucket Name for Database Snapshots
    Value: !Ref S3BackupBucket
  EC2InstanceProfileName:
    Description: IAM Instance Profile Name for EC2
    Value: !Ref EC2InstanceProfile

