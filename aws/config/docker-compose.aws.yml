# ==============================================================================
# CloudOps Sentinel - AWS Production Docker Compose
# Architecture: Single EC2 Host connected to Amazon RDS PostgreSQL 16 & AWS S3
# ==============================================================================
version: "3.8"

networks:
  sentinel-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Console (React 18 + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    image: cloudops-sentinel-frontend:latest
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sentinel-net
    volumes:
      - /var/log/cloudops-sentinel:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  # ----------------------------------------------------------------------------
  # 2. Backend REST API & Telemetry Engine (FastAPI + SQLAlchemy 2.0 Async)
  # ----------------------------------------------------------------------------
  backend:
    image: cloudops-sentinel-backend:latest
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - /etc/cloudops-sentinel/.env.production
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DEBUG=false
    volumes:
      - /var/log/cloudops-sentinel:/var/log/cloudops-sentinel
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 3. RDS PostgreSQL Metrics Exporter
  # ----------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sentinel-postgres-exporter
    restart: always
    ports:
      - "9187:9187"
    environment:
      # Data source pointing to Amazon RDS PostgreSQL using sslmode=require
      DATA_SOURCE_NAME: "postgresql://${RDS_MONITOR_USER}:${RDS_MONITOR_PASSWORD}@${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DATABASE}?sslmode=require"
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 4. Prometheus Telemetry Collector
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinel-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ----------------------------------------------------------------------------
  # 5. Prometheus Alertmanager
  # ----------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sentinel-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M

  # ----------------------------------------------------------------------------
  # 6. Grafana Operational Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: sentinel-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M

volumes:
  prometheus_data:
  grafana_data:

