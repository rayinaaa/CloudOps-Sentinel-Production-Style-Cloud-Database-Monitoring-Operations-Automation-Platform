services:
  # ============================================================================
  # 1. SENTINEL METADATA DATABASE (Oracle Database 23ai Free)
  # Stores targets, metric timeseries, alerts, audit trails, and execution logs
  # ============================================================================
  sentinel-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: sentinel-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-sentinel_secret_dev_pass}
      APP_USER: ${ORACLE_USER:-sentinel_admin}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-sentinel_secret_dev_pass}
      ORACLE_DATABASE: FREEPDB1
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - sentinel_oradata:/opt/oracle/oradata
      - ./scripts/phase1_oracle_schema.sql:/container-entrypoint-initdb.d/01_saas_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - sentinel-net

  # ============================================================================
  # 2. MONITORED TARGET DATABASE (Simulates Production Oracle Database)
  # ============================================================================
  monitored-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: monitored-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${TARGET_ORACLE_PASSWORD:-target_secret_dev_pass}
      APP_USER: ${TARGET_ORACLE_USER:-monitor_agent}
      APP_USER_PASSWORD: ${TARGET_ORACLE_PASSWORD:-target_secret_dev_pass}
      ORACLE_DATABASE: FREEPDB1
    ports:
      - "${TARGET_ORACLE_PORT:-1522}:1521"
    volumes:
      - monitored_oradata:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - sentinel-net

  # ============================================================================
  # 3. SENTINEL BACKEND API (FastAPI + Background Telemetry Collector)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    depends_on:
      sentinel-db:
        condition: service_healthy
      monitored-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - DB_ENGINE=oracle
      - ORACLE_SERVER=sentinel-db
      - ORACLE_PORT=1521
      - ORACLE_SERVICE=FREEPDB1
      - ORACLE_USER=${ORACLE_USER:-sentinel_admin}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-sentinel_secret_dev_pass}
      - DATABASE_URL=oracle+oracledb_async://${ORACLE_USER:-sentinel_admin}:${ORACLE_PASSWORD:-sentinel_secret_dev_pass}@sentinel-db:1521/?service_name=FREEPDB1
      - SYNC_DATABASE_URL=oracle+oracledb://${ORACLE_USER:-sentinel_admin}:${ORACLE_PASSWORD:-sentinel_secret_dev_pass}@sentinel-db:1521/?service_name=FREEPDB1
      - TARGET_ORACLE_SERVER=monitored-db
      - TARGET_ORACLE_PORT=1521
      - TARGET_ORACLE_SERVICE=FREEPDB1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    volumes:
      - ./backend:/app
    networks:
      - sentinel-net

  # ============================================================================
  # 4. SENTINEL FRONTEND CONSOLE (React + Vite + Tailwind Operations Dashboard)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      - backend
    networks:
      - sentinel-net

  # ============================================================================
  # 5. ORACLE EXPORTER (Prometheus Metrics Exporter for Oracle Database)
  # ============================================================================
  oracle-exporter:
    image: iamseth/oracledb_exporter:latest
    container_name: sentinel-oracle-exporter
    restart: unless-stopped
    ports:
      - "9161:9161"
    environment:
      DATA_SOURCE_NAME: "oracle://${ORACLE_USER:-sentinel_admin}:${ORACLE_PASSWORD:-sentinel_secret_dev_pass}@sentinel-db:1521/FREEPDB1"
    depends_on:
      sentinel-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - sentinel-net

  # ============================================================================
  # 5. PROMETHEUS TELEMETRY SCRAPER & ALERT ENGINE
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - sentinel-net

  # ============================================================================
  # 6. GRAFANA DASHBOARDS & VISUALIZATION
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: sentinel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - sentinel-net

  # ============================================================================
  # 7. PROMETHEUS ALERTMANAGER (Alert Ingestion & Dispatch Engine)
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sentinel-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  sentinel_oradata:
    driver: local
  monitored_oradata:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
