services:
  # ============================================================================
  # 1. SENTINEL METADATA DATABASE
  # Stores targets, metric timeseries, alerts, audit trails, and execution logs
  # ============================================================================
  sentinel-db:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_secret_dev_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
      - ./scripts/phase1_saas_schema.sql:/docker-entrypoint-initdb.d/02_saas_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_admin} -d ${POSTGRES_DB:-sentinel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - sentinel-net

  # ============================================================================
  # 2. MONITORED TARGET DATABASE (Simulates Production RDS / EC2 Database)
  # Preloaded with pg_stat_statements for slow query & lock monitoring
  # ============================================================================
  monitored-db:
    image: postgres:16-alpine
    container_name: monitored-postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c track_activity_query_size=2048
      -c log_min_duration_statement=500
    environment:
      POSTGRES_DB: ${TARGET_POSTGRES_DB:-ecommerce_production}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TARGET_POSTGRES_PASSWORD:-target_secret_dev_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${TARGET_POSTGRES_PORT:-5433}:5432"
    volumes:
      - monitored_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${TARGET_POSTGRES_DB:-ecommerce_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - sentinel-net

  # ============================================================================
  # 3. SENTINEL BACKEND API (FastAPI + Background Telemetry Collector)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    depends_on:
      sentinel-db:
        condition: service_healthy
      monitored-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_SERVER=sentinel-db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_secret_dev_pass}@sentinel-db:5432/${POSTGRES_DB:-sentinel_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_secret_dev_pass}@sentinel-db:5432/${POSTGRES_DB:-sentinel_db}
      - TARGET_POSTGRES_SERVER=monitored-db
      - TARGET_POSTGRES_PORT=5432
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    volumes:
      - ./backend:/app
    networks:
      - sentinel-net

  # ============================================================================
  # 4. SENTINEL FRONTEND CONSOLE (React + Vite + Tailwind Operations Dashboard)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      - backend
    networks:
      - sentinel-net

  # ============================================================================
  # 5. POSTGRES EXPORTER (Prometheus Metrics Exporter for Database)
  # ============================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sentinel-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_secret_dev_pass}@sentinel-db:5432/${POSTGRES_DB:-sentinel_db}?sslmode=disable"
    depends_on:
      sentinel-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - sentinel-net

  # ============================================================================
  # 5. PROMETHEUS TELEMETRY SCRAPER & ALERT ENGINE
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentinel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - sentinel-net

  # ============================================================================
  # 6. GRAFANA DASHBOARDS & VISUALIZATION
  # ============================================================================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: sentinel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - sentinel-net

  # ============================================================================
  # 7. PROMETHEUS ALERTMANAGER (Alert Ingestion & Dispatch Engine)
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sentinel-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge

volumes:
  sentinel_pgdata:
    driver: local
  monitored_pgdata:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
