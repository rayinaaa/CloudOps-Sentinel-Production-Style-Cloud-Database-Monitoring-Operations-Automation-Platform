name: CloudOps Sentinel CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-and-audit:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Security Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pip-audit

      - name: Ruff Linter & Formatter Check
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Security Static Analysis (Bandit)
        run: |
          bandit -r backend/app -ll -ii

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinel_db
          POSTGRES_USER: sentinel_admin
          POSTGRES_PASSWORD: sentinel_secret_dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application Dependencies & System Tools
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          chmod +x scripts/*.sh

      - name: Run Alembic Migrations
        env:
          DB_ENGINE: postgresql
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: sentinel_db
          POSTGRES_USER: sentinel_admin
          POSTGRES_PASSWORD: sentinel_secret_dev_pass
        run: |
          cd backend
          alembic upgrade head

      - name: Execute Pytest Suite with Coverage
        env:
          DB_ENGINE: postgresql
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: sentinel_db
          POSTGRES_USER: sentinel_admin
          POSTGRES_PASSWORD: sentinel_secret_dev_pass
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: sentinel_db
          DB_USER: sentinel_admin
          PGPASSWORD: sentinel_secret_dev_pass
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=term-missing

  docker-compose-validation:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Env Template
        run: cp .env.example .env

      - name: Validate Docker Compose Syntax
        run: docker compose config --quiet

