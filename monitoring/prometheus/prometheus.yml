global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  # 1. CloudOps Sentinel FastAPI Backend Telemetry
  - job_name: "sentinel-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
        labels:
          environment: "production"
          service: "cloudops-sentinel-api"

  # 2. PostgreSQL Exporter Telemetry
  - job_name: "postgres-exporter"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          environment: "production"
          service: "sentinel-postgres-exporter"

  # 3. Prometheus Self-Monitoring
  - job_name: "prometheus"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus-telemetry"
